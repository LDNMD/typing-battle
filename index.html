<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>打字战斗 · 四六级单词</title>
<style>
  :root {
    --bg1: #0b0d1a; --bg2: #12152b;
    --cyan: #3ee6ff; --green: #3ee6a0; --gold: #ffd166; --orange: #ff8a5c;
    --pink: #ff5c8a; --red: #ff3b3b; --text: #e8ecff; --dim: #8b93c7;
    --shake-x: 0px; --shake-y: 0px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; overflow: hidden; background: var(--bg1); color: var(--text);
    font-family: "Consolas", "SF Mono", "Cascadia Mono", Menlo, monospace;
    user-select: none; -webkit-user-select: none;
  }
  #game { position: fixed; inset: 0; overflow: hidden; transform: translate(var(--shake-x), var(--shake-y)); }
  #game.shaking { animation: shake 0.28s linear; }
  @keyframes shake {
    0%   { transform: translate(0,0); }
    20%  { transform: translate(calc(var(--shake-x)*-1), var(--shake-y)); }
    40%  { transform: translate(var(--shake-x), calc(var(--shake-y)*-1)); }
    60%  { transform: translate(calc(var(--shake-x)*-1), calc(var(--shake-y)*-1)); }
    80%  { transform: translate(var(--shake-x), var(--shake-y)); }
    100% { transform: translate(0,0); }
  }
  #bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(62,230,255,0.08), transparent 60%),
      linear-gradient(var(--bg2), var(--bg1));
  }
  #bg::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(62,230,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(62,230,255,0.05) 1px, transparent 1px);
    background-size: 44px 44px; animation: gridmove 16s linear infinite;
    mask-image: linear-gradient(to bottom, transparent, #000 20%, #000 80%, transparent);
  }
  @keyframes gridmove { from { background-position: 0 0, 0 0; } to { background-position: 0 44px, 44px 0; } }

  #hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 16px;
    padding: 12px 16px; font-size: 14px; z-index: 10; pointer-events: none;
  }
  #hud .group { display: flex; align-items: center; gap: 8px; }
  #hud .label { color: var(--dim); font-size: 11px; letter-spacing: 1px; }
  #hpBar { position: relative; width: 150px; height: 18px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.22); border-radius: 9px; overflow: hidden; }
  #hpFill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); border-radius: 8px; transition: width 0.25s ease, background 0.35s ease; box-shadow: 0 0 10px rgba(62,230,255,0.5); }
  #hpText { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.7); }
  #score { font-size: 20px; font-weight: bold; color: var(--cyan); text-shadow: 0 0 12px rgba(62,230,255,0.6); min-width: 54px; }
  #combo { font-size: 16px; font-weight: bold; color: var(--gold); min-width: 44px; transition: transform 0.1s; }
  #combo.pop { transform: scale(1.4); }
  #level { color: var(--green); font-weight: bold; }
  #best { color: var(--dim); }
  #hud button {
    pointer-events: auto; margin-left: auto; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15); color: var(--text); border-radius: 8px;
    padding: 6px 12px; font-family: inherit; font-size: 13px; cursor: pointer;
  }
  #hud button:hover { background: rgba(255,255,255,0.14); }

  #oppPanel {
    position: absolute; top: 68px; right: 14px; z-index: 10;
    display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
    padding: 10px 14px; border-radius: 12px;
    background: rgba(16,20,40,0.72); border: 1px solid rgba(255,255,255,0.12); pointer-events: none;
  }
  #oppPanel .opp-name { font-size: 12px; color: var(--dim); }
  #oppHpBar { position: relative; width: 150px; height: 15px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.22); border-radius: 7px; overflow: hidden; }
  #oppHpFill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--pink), var(--red)); border-radius: 6px; transition: width 0.25s ease; }
  #oppHpText { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.7); }
  .opp-stats { font-size: 11px; color: var(--dim); }
  .opp-stats b { color: var(--gold); }

  /* ---------- 答题区 ---------- */
  #playArea {
    position: absolute; top: 7vh; left: 50%; transform: translateX(-50%);
    width: min(92vw, 660px); display: flex; flex-direction: column; gap: 14px; align-items: center; z-index: 8;
  }
  #wordCard {
    width: 100%; display: flex; flex-direction: column; gap: 14px; align-items: center;
    padding: 22px 18px; background: rgba(16,20,40,0.62); border: 1px solid rgba(255,255,255,0.12); border-radius: 18px;
  }
  #cnText { font-size: clamp(24px, 6.5vw, 40px); font-weight: bold; color: #fff; line-height: 1.3; text-align: center; }
  #wordBlanks {
    font-size: clamp(28px, 8.5vw, 52px); letter-spacing: clamp(4px, 1.6vw, 10px);
    min-height: 1.3em; font-weight: bold; color: var(--dim); text-align: center; line-height: 1.2; word-break: break-all;
  }
  #wordBlanks span { transition: color 0.06s, text-shadow 0.06s; }
  #wordBlanks span.done { color: var(--green); text-shadow: 0 0 10px rgba(62,230,160,0.6); }
  #wordBlanks span.hint { color: var(--gold); }
  #wordBlanks span.cur { color: #fff; text-shadow: 0 0 14px rgba(62,230,255,1); }
  #wordBlanks span.miss { color: var(--red); }
  #wordBlanks.error span.cur { color: var(--red); text-shadow: 0 0 14px var(--red); }
  #progressBar { width: 100%; height: 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); border-radius: 7px; overflow: hidden; }
  #progressFill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); border-radius: 6px; }
  #feedback { font-size: 21px; font-weight: bold; min-height: 28px; text-align: center; }

  #controls { width: 100%; display: flex; gap: 10px; align-items: stretch; }
  .cbtn {
    flex: 0 0 auto; min-width: 62px; font-family: inherit; font-size: 20px;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.18);
    color: var(--text); border-radius: 12px; padding: 12px 14px; cursor: pointer; line-height: 1;
  }
  .cbtn:active { background: rgba(62,230,255,0.25); }
  #hintBtn { color: var(--gold); }
  #hintBtn .hint-cost { font-size: 11px; color: var(--dim); display: block; margin-top: 3px; }
  #boostBtn { width: 100%; color: var(--cyan); font-size: 16px; }
  .cbtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #typeInput {
    flex: 1; font-family: inherit; font-size: 18px; padding: 14px 14px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(62,230,255,0.4);
    color: #fff; border-radius: 12px; outline: none; text-align: center; letter-spacing: 2px;
  }
  #typeInput:focus { border-color: var(--cyan); box-shadow: 0 0 14px rgba(62,230,255,0.35); }

  #fx { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
  .particle { position: absolute; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; }

  #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 9; background: radial-gradient(ellipse at center, transparent 55%, rgba(255,59,59,0.55)); opacity: 0; transition: opacity 0.35s; }
  #vignette.on { opacity: 1; transition: opacity 0s; }

  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center; z-index: 20; background: rgba(8,10,22,0.86); backdrop-filter: blur(6px);
  }
  .overlay.hidden { display: none; }
  .overlay h1 {
    font-size: clamp(30px, 8vw, 44px); letter-spacing: 3px;
    background: linear-gradient(90deg, var(--cyan), var(--green), var(--gold), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(62,230,255,0.2);
  }
  .overlay .sub { color: var(--dim); max-width: 560px; line-height: 1.8; font-size: 14px; padding: 0 16px; }
  .overlay .big { font-size: 26px; color: var(--cyan); font-weight: bold; }
  .overlay input {
    font-family: inherit; font-size: 16px; padding: 10px 14px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.2);
    color: var(--text); border-radius: 10px; text-align: center; width: 220px; outline: none;
  }
  .overlay input:focus { border-color: var(--cyan); }
  .btn {
    margin-top: 8px; font-family: inherit; font-size: 17px; letter-spacing: 2px;
    color: #061018; background: linear-gradient(90deg, var(--cyan), var(--green));
    border: none; border-radius: 10px; padding: 13px 34px; cursor: pointer; font-weight: bold;
    box-shadow: 0 0 24px rgba(62,230,255,0.4); transition: transform 0.1s, box-shadow 0.2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 0 34px rgba(62,230,255,0.6); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn.secondary { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid rgba(255,255,255,0.2); box-shadow: none; }
  .menu-btns { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .status { color: var(--dim); font-size: 13px; min-height: 18px; }

  .room-box { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
  .room-sec {
    display: flex; flex-direction: column; gap: 10px; align-items: center;
    padding: 18px 20px; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; min-width: 250px;
  }
  .room-sec h2 { font-size: 16px; color: var(--cyan); }
  .room-code { font-size: 32px; letter-spacing: 8px; color: var(--gold); font-weight: bold; }

  #countdownNum { font-size: clamp(80px, 24vw, 120px); color: var(--cyan); text-shadow: 0 0 40px rgba(62,230,255,0.8); }

  .stats { display: flex; gap: 30px; color: var(--text); font-size: 14px; flex-wrap: wrap; justify-content: center; }
  .stats b { display: block; font-size: 24px; color: var(--gold); }

  #reviewBox { max-width: 540px; width: 92%; max-height: 200px; overflow-y: auto; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px 14px; text-align: left; }
  .review-title { font-size: 14px; color: var(--gold); margin-bottom: 8px; text-align: center; }
  .review-item { display: flex; align-items: center; gap: 12px; padding: 5px 0; border-bottom: 1px dashed rgba(255,255,255,0.08); font-size: 14px; flex-wrap: wrap; }
  .review-item:last-child { border-bottom: none; }
  .review-item .rw { color: var(--cyan); font-weight: bold; min-width: 100px; }
  .review-item .rc { color: var(--text); flex: 1; }
  .review-item .rr { color: var(--pink); font-size: 12px; }
  .review-empty { color: var(--dim); font-size: 13px; text-align: center; padding: 12px 0; }

  @media (max-width: 600px) {
    #hud { flex-wrap: wrap; gap: 8px; padding: 8px 10px; font-size: 12px; }
    #hud #best { display: none; }
    #hpBar { width: 108px; height: 16px; }
    #score { font-size: 16px; }
    #playArea { top: 10vh; }
  }
</style>
</head>
<body>
<div id="game">
  <div id="bg"></div>

  <div id="hud">
    <div class="group"><span class="label">生命</span><div id="hpBar"><div id="hpFill"></div><span id="hpText">100</span></div></div>
    <div class="group"><span class="label">得分</span><span id="score">0</span></div>
    <div class="group"><span class="label">连击</span><span id="combo">x0</span></div>
    <div class="group"><span class="label">波次</span><span id="level">1</span></div>
    <div class="group"><span class="label">最高</span><span id="best">0</span></div>
    <button id="muteBtn" title="静音 (M)">🔊</button>
  </div>

  <div id="oppPanel">
    <div class="opp-name">对手：<span id="oppName">—</span></div>
    <div id="oppHpBar"><div id="oppHpFill"></div><span id="oppHpText">100</span></div>
    <div class="opp-stats">得分 <b id="oppScore">0</b> · 连击 <b id="oppCombo">x0</b> · 背词 <b id="oppKills">0</b></div>
  </div>

  <div id="playArea">
    <div id="wordCard">
      <div id="cnText">准备开始…</div>
      <div id="wordBlanks">_ _ _ _ _</div>
      <div id="progressBar"><div id="progressFill"></div></div>
      <div id="feedback"></div>
    </div>
    <div id="controls">
      <button class="cbtn" id="replayBtn" title="重听发音">🔊</button>
      <input id="typeInput" type="text" lang="en" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="点这里输入英文…" enterkeyhint="done">
      <button class="cbtn" id="hintBtn" title="提示 (Tab)">💡<span class="hint-cost">-10分</span></button>
    </div>
    <button class="cbtn" id="boostBtn">⏱ 加时 +20s（剩余 5 次）</button>
  </div>

  <div id="fx"></div>
  <div id="vignette"></div>

  <!-- 首页：选择模式 -->
  <div id="menuOverlay" class="overlay">
    <h1>打字战斗 · 四六级</h1>
    <p class="sub">根据中文释义默写英文单词。答对回血 +5，超时扣血 -10。</p>
    <div class="menu-btns">
      <button class="btn" id="singleBtn">🎮 单人游戏</button>
      <button class="btn" id="multiBtn">⚔️ 多人对战</button>
    </div>
    <p class="sub">（电脑直接打字 · 手机点输入框打字 · 空格重听 · Tab 提示）</p>
  </div>

  <!-- 多人：房间页 -->
  <div id="roomOverlay" class="overlay hidden">
    <h1>多人对战</h1>
    <div class="room-box">
      <div class="room-sec">
        <h2>创建房间</h2>
        <input id="createName" placeholder="你的昵称（可留空）" maxlength="12">
        <input id="createPwd" placeholder="房间密码（可留空）" type="password">
        <button class="btn" id="createBtn">创建房间</button>
      </div>
      <div class="room-sec">
        <h2>加入房间</h2>
        <input id="joinCode" placeholder="6 位房间号" maxlength="6" style="text-transform:uppercase">
        <input id="joinName" placeholder="你的昵称（可留空）" maxlength="12">
        <input id="joinPwd" placeholder="房间密码（若设置）" type="password">
        <button class="btn" id="joinBtn">加入房间</button>
      </div>
    </div>
    <p class="status" id="roomStatus"></p>
    <button class="btn secondary" id="roomBackBtn">返回</button>
  </div>

  <!-- 倒计时 -->
  <div id="countdownOverlay" class="overlay hidden"><h1 id="countdownNum">3</h1></div>

  <!-- 暂停 -->
  <div id="pauseOverlay" class="overlay hidden">
    <h1>已暂停</h1>
    <button class="btn" id="resumeBtn">继续</button>
  </div>

  <!-- 结算 -->
  <div id="overOverlay" class="overlay hidden">
    <h1 id="resultTitle">失败</h1>
    <div class="big" id="finalScore">0</div>
    <div class="stats">
      <div>背单词数<b id="finalKills">0</b></div>
      <div>最高连击<b id="finalCombo">0</b></div>
      <div>对手得分<b id="oppFinalScore">—</b></div>
      <div>历史最高<b id="finalBest">0</b></div>
    </div>
    <div id="reviewBox">
      <div class="review-title">📖 错词回顾</div>
      <div id="reviewList"></div>
    </div>
    <div class="menu-btns">
      <button class="btn" id="rematchBtn">再来一局</button>
      <button class="btn secondary" id="menuBtn">返回菜单</button>
    </div>
    <div class="sub" id="rematchStatus"></div>
  </div>
</div>

  let oppState = null;

  // ---------- 音频 ----------
  let audioCtx = null;
  function ac() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
  function tone(freq, dur, type = 'square', vol = 0.06, slide = 0) {
    if (G.muted) return;
    try {
      const ctx = ac();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = freq;
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), ctx.currentTime + dur);
      g.gain.value = vol;
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      o.connect(g).connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + dur);
    } catch (e) { /* 忽略 */ }
  }
  const sfx = {
    type: () => tone(620, 0.06, 'square', 0.04),
    correct: () => { tone(520, 0.1, 'sawtooth', 0.06); setTimeout(() => tone(780, 0.12, 'sawtooth', 0.06), 60); },
    wrong: () => tone(140, 0.18, 'sawtooth', 0.07),
    hint: () => tone(880, 0.08, 'sine', 0.06),
    boost: () => { tone(700, 0.1, 'sine', 0.06); setTimeout(() => tone(1000, 0.12, 'sine', 0.06), 80); },
    hit: () => tone(90, 0.3, 'sawtooth', 0.12, -40),
    win: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.25, 'sine', 0.08), i * 120)); },
    lose: () => { [440, 330, 220, 110].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'sawtooth', 0.08), i * 160)); },
  };
  function warmupVoices() {
    try {
      if (!('speechSynthesis' in window)) return;
      const load = () => { try { speechSynthesis.getVoices(); } catch (e) {} };
      load();
      speechSynthesis.onvoiceschanged = load;
    } catch (e) { /* 忽略 */ }
  }
  function speak(word) {
    if (G.muted) return;
    try {
      if (!('speechSynthesis' in window)) return;
      const u = new SpeechSynthesisUtterance(word);
      u.lang = 'en-US'; u.rate = 0.85;
      const voices = speechSynthesis.getVoices();
      const en = voices.find(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith('en'));
      if (en) u.voice = en;
      speechSynthesis.cancel();
      // 稍作延迟，规避部分浏览器 cancel 后立即 speak 不发声的问题
      setTimeout(() => { try { if (!G.muted) speechSynthesis.speak(u); } catch (e) {} }, 30);
    } catch (e) { /* 忽略 */ }
  }

  // ---------- 网络 ----------
  let ws = null, myId = -1, myName = '玩家', oppNameStr = '对手', stateTimer = null, cdTimer = null, pendingSend = null;

  function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

  function openWS(cb) {
    if (ws && ws.readyState === 1) { cb(); return; }
    if (ws && ws.readyState === 0) { pendingSend = cb; return; }
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host);
    ws.onopen = () => { if (pendingSend) { const c = pendingSend; pendingSend = null; c(); } };
    ws.onmessage = (ev) => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } handleMsg(m); };
    ws.onerror = () => { roomStatus.textContent = '连接服务器失败，请重试'; };
    ws.onclose = () => onWSClose();
    pendingSend = cb;
  }

  function createRoom() {
    const name = $('#createName').value.trim() || '玩家';
    const pwd = $('#createPwd').value;
    myName = name;
    roomStatus.textContent = '正在创建房间…';
    openWS(() => send({ type: 'createRoom', name, password: pwd }));
  }
  function joinRoom() {
    const code = $('#joinCode').value.trim().toUpperCase();
    if (!code) { roomStatus.textContent = '请输入房间号'; return; }
    const name = $('#joinName').value.trim() || '玩家';
    const pwd = $('#joinPwd').value;
    myName = name;
    roomStatus.textContent = '正在加入房间…';
    openWS(() => send({ type: 'joinRoom', code, name, password: pwd }));
  }

  function handleMsg(m) {
    switch (m.type) {
      case 'roomCreated':
        roomStatus.innerHTML = `房间号 <span class="room-code">${m.code}</span><br>已复制到剪贴板，等待对手加入…`;
        if (navigator.clipboard) navigator.clipboard.writeText(m.code).catch(() => {});
        break;
      case 'roomError':
        roomStatus.textContent = m.message;
        break;
      case 'start': beginMatch(m); break;
      case 'opponent': applyOppState(m); break;
      case 'result': onResult(m); break;
      case 'opponentLeft': onOpponentLeft(); break;
      case 'rematchWait': $('#rematchStatus').textContent = '已准备，等待对手…'; break;
    }
  }

  function onWSClose() {
    if (G.running && !G.over) { G.running = false; G.over = true; renderGameOver(false, null, '与服务器断开连接'); }
    else if (!G.running && !G.over) roomStatus.textContent = '连接已断开，请重试';
  }
  function onOpponentLeft() {
    if (G.running && !G.over) { G.over = true; G.running = false; renderGameOver(true, oppState ? oppState.score : 0, '对手已离开'); }
    else if (!G.running && !G.over) roomStatus.textContent = '对方已离开，请重新创建或加入房间';
  }

  function applyOppState(s) {
    oppState = s;
    if (!s) return;
    oppHpFill.style.width = (Math.max(0, s.hp || 0)) + '%';
    oppHpText.textContent = s.hp || 0;
    oppScore.textContent = s.score || 0;
    oppCombo.textContent = 'x' + (s.combo || 0);
    oppKills.textContent = s.kills || 0;
  }

  function onResult(m) {
    if (m.win) {
      if (!G.over) { G.over = true; G.running = false; renderGameOver(true, m.opponentScore); }
    } else {
      if (G.over) { $('#oppFinalScore').textContent = m.opponentScore; }
      else { G.over = true; G.running = false; renderGameOver(false, m.opponentScore); }
    }
  }

  function beginMatch(data) {
    G.mode = 'multi';
    myId = data.id; myName = data.name; oppNameStr = data.opponentName;
    oppName.textContent = oppNameStr;
    $('#rematchBtn').disabled = false;
    $('#rematchStatus').textContent = '';
    menuOverlay.classList.add('hidden');
    roomOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    clearInterval(cdTimer);
    let n = 3;
    countdownNum.textContent = n;
    countdownOverlay.classList.remove('hidden');
    cdTimer = setInterval(() => {
      n--;
      if (n <= 0) { clearInterval(cdTimer); countdownOverlay.classList.add('hidden'); startGame(); }
      else countdownNum.textContent = n;
    }, 800);
  }

  // ---------- 工具 ----------
  function rand(min, max) { return Math.random() * (max - min) + min; }
  function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
  function pick(arr) { return arr[randInt(0, arr.length - 1)]; }

  function pickWord(level) {
    let pool;
    if (level <= 2) pool = VOCAB.filter(v => v.l === 4 && v.w.length <= 6);
    else if (level <= 4) pool = VOCAB.filter(v => v.l === 4);
    else if (level <= 6) pool = VOCAB.filter(v => v.w.length >= 6);
    else pool = VOCAB.filter(v => v.l === 6);
    if (!pool.length) pool = VOCAB;
    return pick(pool);
  }

  function spellHTML(word, typed, hinted) {
    let h = '';
    for (let i = 0; i < word.length; i++) {
      let cls = '', ch = '_';
      if (i < typed) { cls = 'done'; ch = word[i]; }
      else if (i === typed) { cls = 'cur'; ch = hinted[i] ? word[i] : '_'; }
      else if (hinted[i]) { cls = 'hint'; ch = word[i]; }
      h += `<span class="${cls}">${ch}</span>`;
    }
    return h;
  }

  // ---------- 错词回顾 ----------
  function addReview(w, c, reason) {
    const e = G.review.find(r => r.w === w);
    if (e) { if (!e.reasons.includes(reason)) e.reasons.push(reason); }
    else G.review.push({ w, c, reasons: [reason] });
  }
  function renderReview() {
    const box = $('#reviewList');
    if (!G.review.length) { box.innerHTML = '<div class="review-empty">本局没有错词，太棒了！</div>'; return; }
    let html = '';
    G.review.slice(0, 40).forEach(r => {
      html += `<div class="review-item"><span class="rw">${r.w}</span><span class="rc">${r.c}</span><span class="rr">${r.reasons.join(' / ')}</span></div>`;
    });
    box.innerHTML = html;
  }

  // ---------- HUD & 显示 ----------
  function updateHUD() {
    const ratio = G.hp / G.maxHp;
    hpFill.style.width = (ratio * 100) + '%';
    hpFill.style.background = ratio > 0.5 ? 'linear-gradient(90deg, var(--green), var(--cyan))'
      : ratio > 0.25 ? 'linear-gradient(90deg, var(--gold), var(--orange))' : 'linear-gradient(90deg, var(--orange), var(--red))';
    hpText.textContent = G.hp;
    scoreEl.textContent = G.score;
    comboEl.textContent = 'x' + G.combo;
    levelEl.textContent = G.level;
    bestEl.textContent = G.best;
  }
  function updateBlanks() {
    wordBlanks.innerHTML = spellHTML(W.word, W.typed, W.hinted);
  }
  function updateProgress() {
    const r = Math.max(0, W.timeLeft / W.timeLimit);
    progressFill.style.width = (r * 100) + '%';
    progressFill.style.background = r > 0.5 ? 'linear-gradient(90deg, var(--green), var(--cyan))'
      : r > 0.25 ? 'linear-gradient(90deg, var(--gold), var(--orange))' : 'linear-gradient(90deg, var(--orange), var(--red))';
  }
  function showFeedback(text, color) {
    feedbackEl.textContent = text;
    feedbackEl.style.color = color || 'var(--text)';
  }

  // ---------- 特效 ----------
  function shake(intensity) {
    gameEl.style.setProperty('--shake-x', intensity + 'px');
    gameEl.style.setProperty('--shake-y', intensity + 'px');
    gameEl.classList.remove('shaking');
    void gameEl.offsetWidth;
    gameEl.classList.add('shaking');
  }
  function flashError() {
    wordBlanks.classList.add('error');
    clearTimeout(flashError._t);
    flashError._t = setTimeout(() => wordBlanks.classList.remove('error'), 160);
  }
  function flashHit() {
    vignette.classList.add('on');
    clearTimeout(flashHit._t);
    flashHit._t = setTimeout(() => vignette.classList.remove('on'), 120);
  }
  function addParticles(x, y, color, count = 14) {
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.background = color;
      p.style.boxShadow = `0 0 6px ${color}`;
      p.style.left = x + 'px'; p.style.top = y + 'px';
      fxLayer.appendChild(p);
      const ang = rand(0, Math.PI * 2), dist = rand(24, 70);
      p.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1 },
        { transform: `translate(${Math.cos(ang) * dist}px, ${Math.sin(ang) * dist}px) scale(0.2)`, opacity: 0 }
      ], { duration: randInt(350, 650), easing: 'ease-out' }).onfinish = () => p.remove();
    }
  }
  function comboPop() {
    comboEl.classList.remove('pop'); void comboEl.offsetWidth; comboEl.classList.add('pop');
  }
  function wordCenter() {
    const r = wordBlanks.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  // ---------- 答题流程 ----------
  function nextWord() {
    const entry = pickWord(G.level);
    W.word = entry.w; W.cn = entry.c;
    W.typed = 0; W.hinted = Array(entry.w.length).fill(false);
    W.mistakes = 0; W.hintUsed = false;
    W.timeLimit = 10000; // 默认 10 秒（单位：毫秒）
    W.timeLeft = W.timeLimit;
    W.answered = false;
    cnText.textContent = entry.c;
    showFeedback('', '');
    updateBlanks();
    updateProgress();
    speak(entry.w);
    typeInput.focus();
  }

  function processLetter(ch) {
    if (!W.word || W.answered || G.over || G.paused || !G.running) return;
    const need = W.word[W.typed];
    if (ch === need) {
      W.typed++;
      sfx.type();
      updateBlanks();
      if (W.typed >= W.word.length) onCorrect();
    } else {
      W.mistakes++;
      G.combo = Math.max(0, G.combo - 1);
      shake(2); flashError(); sfx.wrong(); updateHUD();
    }
  }

  function onCorrect() {
    W.answered = true;
    const parts = [];
    if (W.mistakes > 0) parts.push('拼错' + W.mistakes + '次');
    if (W.hintUsed) parts.push('用了提示');
    if (parts.length) addReview(W.word, W.cn, parts.join(' · '));

    G.hp = Math.min(G.maxHp, G.hp + 5);
    G.kills++;
    G.combo++;
    G.maxCombo = Math.max(G.maxCombo, G.combo);
    G.score += Math.round(W.word.length * 15 * (1 + G.combo * 0.1));
    G.level = 1 + Math.floor(G.kills / 8);

    const c = wordCenter();
    addParticles(c.x, c.y, 'var(--green)', 16);
    showFeedback('✓ 答对 +5', 'var(--green)');
    sfx.correct();
    comboPop();
    updateHUD();
    setTimeout(nextWord, 480);
  }

  function timeUp() {
    if (W.answered || !W.word) return;
    W.answered = true;
    addReview(W.word, W.cn, '未答出');
    G.hp = Math.max(0, G.hp - 10);
    G.combo = 0;
    revealWord();
    showFeedback('✗ 超时 -10  ' + W.word, 'var(--red)');
    shake(6); flashHit(); sfx.hit();
    updateHUD();
    if (G.hp <= 0) { onLocalDeath(); return; }
    setTimeout(nextWord, 1400);
  }

  function revealWord() {
    let h = '';
    for (let i = 0; i < W.word.length; i++) h += `<span class="miss">${W.word[i]}</span>`;
    wordBlanks.innerHTML = h;
  }

  function useHint() {
    if (!W.word || W.answered || G.over || G.paused || !G.running) return;
    for (let i = W.typed; i < W.word.length; i++) {
      if (!W.hinted[i]) {
        W.hinted[i] = true; W.hintUsed = true;
        G.score = Math.max(0, G.score - 10);
        sfx.hint(); updateHUD(); updateBlanks();
        return;
      }
    }
  }
  function useBoost() {
    if (!W.word || W.answered || G.over || G.paused || !G.running) return;
    if (G.timeBoost <= 0) return;
    G.timeBoost--;
    W.timeLeft += 20000;
    W.timeLimit += 20000;
    sfx.boost();
    updateProgress();
    updateBoostBtn();
  }
  function updateBoostBtn() {
    boostBtn.textContent = '⏱ 加时 +20s（剩余 ' + G.timeBoost + ' 次）';
    boostBtn.disabled = G.timeBoost <= 0;
  }

  // ---------- 流程 ----------
  function startGame() {
    G.running = true; G.over = false; G.paused = false;
    G.hp = G.maxHp; G.score = 0; G.kills = 0; G.combo = 0; G.maxCombo = 0;
    G.level = 1; G.timeBoost = 5; G.review = [];
    oppState = null;
    applyOppState({ hp: 100, score: 0, kills: 0, combo: 0, level: 1 });
    $('#oppPanel').style.display = G.mode === 'multi' ? '' : 'none';
    overOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    updateHUD();
    updateBoostBtn();
    nextWord();
    if (G.mode === 'multi' && !stateTimer) {
      stateTimer = setInterval(() => {
        if (G.running && !G.over && ws && ws.readyState === 1) {
          send({ type: 'state', hp: G.hp, score: G.score, kills: G.kills, combo: G.combo, level: G.level });
        }
      }, 150);
    }
  }

  function startSingle() {
    G.mode = 'single';
    menuOverlay.classList.add('hidden');
    roomOverlay.classList.add('hidden');
    startGame();
  }

  function onLocalDeath() {
    if (G.mode === 'multi') send({ type: 'dead', score: G.score });
    if (!G.over) { G.over = true; G.running = false; renderGameOver(false, null); }
  }

  function renderGameOver(win, oppScore, note) {
    if (G.score > G.best) { G.best = G.score; localStorage.setItem('typingBattleBest', G.best); }
    $('#resultTitle').textContent = win ? '胜利！' : '失败';
    $('#resultTitle').style.color = win ? 'var(--green)' : 'var(--pink)';
    $('#finalScore').textContent = G.score + ' 分';
    $('#finalKills').textContent = G.kills;
    $('#finalCombo').textContent = 'x' + G.maxCombo;
    $('#finalBest').textContent = G.best;
    $('#oppFinalScore').textContent = (oppScore != null ? oppScore : '—');
    if (note) $('#rematchStatus').textContent = note;
    renderReview();
    overOverlay.classList.remove('hidden');
    updateHUD();
    if (win) sfx.win(); else sfx.lose();
  }

  function togglePause() {
    if (!G.running || G.over) return;
    G.paused = !G.paused;
    pauseOverlay.classList.toggle('hidden', !G.paused);
  }
  function toggleMute() {
    G.muted = !G.muted;
    if (G.muted && 'speechSynthesis' in window) speechSynthesis.cancel();
    $('#muteBtn').textContent = G.muted ? '🔇' : '🔊';
  }

  // ---------- 输入 ----------
  let composing = false;
  typeInput.addEventListener('compositionstart', () => { composing = true; });
  typeInput.addEventListener('compositionend', () => { composing = false; handleInput(); });
  typeInput.addEventListener('input', () => { if (!composing) handleInput(); });
  typeInput.addEventListener('blur', () => {
    if (G.running && !G.over && !G.paused) setTimeout(() => typeInput.focus(), 60);
  });
  function handleInput() {
    if (G.over || G.paused || !G.running || W.answered) { typeInput.value = ''; return; }
    const val = typeInput.value;
    for (const ch of val) {
      if (/[a-zA-Z]/.test(ch)) processLetter(ch.toLowerCase());
    }
    typeInput.value = '';
  }

  function onKey(e) {
    if (e.key === 'Escape') { togglePause(); return; }
    if (e.key === 'm' || e.key === 'M') { toggleMute(); return; }
    if (G.over || G.paused || !G.running) return;
    if (e.key === 'Tab') { e.preventDefault(); useHint(); return; }
    if (e.key === ' ') { e.preventDefault(); if (W.word) speak(W.word); return; }
  }

  // ---------- 主循环 ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    if (G.running && !G.paused && !G.over) {
      if (W.word && !W.answered) {
        W.timeLeft -= dt * 1000;
        if (W.timeLeft <= 0) timeUp();
        else updateProgress();
      }
    }

    requestAnimationFrame(loop);
  }

  // ---------- 绑定 ----------
  window.addEventListener('keydown', onKey);
  gameEl.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button') || e.target.closest('input')) return;
    if (G.running && !G.over && !G.paused) typeInput.focus();
  });
  $('#singleBtn').addEventListener('click', () => { ac(); startSingle(); });
  $('#multiBtn').addEventListener('click', () => { menuOverlay.classList.add('hidden'); roomOverlay.classList.remove('hidden'); });
  $('#createBtn').addEventListener('click', () => { ac(); createRoom(); });
  $('#joinBtn').addEventListener('click', () => { ac(); joinRoom(); });
  $('#roomBackBtn').addEventListener('click', () => location.reload());
  $('#hintBtn').addEventListener('click', useHint);
  $('#replayBtn').addEventListener('click', () => { if (W.word) speak(W.word); });
  boostBtn.addEventListener('click', useBoost);
  $('#rematchBtn').addEventListener('click', () => {
    if (G.mode === 'multi') {
      send({ type: 'rematch' });
      $('#rematchBtn').disabled = true;
      $('#rematchStatus').textContent = '已准备，等待对手…';
    } else {
      startGame();
    }
  });
  $('#menuBtn').addEventListener('click', () => location.reload());
  $('#resumeBtn').addEventListener('click', togglePause);
  $('#muteBtn').addEventListener('click', toggleMute);

  bestEl.textContent = G.best;
  warmupVoices();
  updateHUD();
  updateBoostBtn();
  applyOppState({ hp: 100, score: 0, kills: 0, combo: 0, level: 1 });
  $('#oppPanel').style.display = 'none';
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
